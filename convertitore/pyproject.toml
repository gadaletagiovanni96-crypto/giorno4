[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "convertitore"
version = "1.0.0"
description = "Strumenti per foto e video: HEIC/foto -> JPG, HEVC/video -> MP4, mescola"
requires-python = ">=3.10"
dependencies = ["pillow", "pillow-heif", "imageio-ffmpeg", "questionary"]

[project.scripts]
converti = "converti:avvia"

[tool.setuptools]
py-modules = ["converti"]
